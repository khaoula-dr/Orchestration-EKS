# Service "headless" (clusterIP: None) : requis pour qu'un StatefulSet donne
# une identité réseau stable à chaque pod (postgres-0, postgres-1, etc.)
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
