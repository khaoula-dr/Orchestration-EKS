apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-allow-ingress
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.name }}
  policyTypes:
    - Ingress
  ingress:
    # L'ALB (target-type: ip) contacte les pods directement depuis des IPs
    # du VPC, pas depuis un pod du cluster — on autorise donc par plage CIDR.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: {{ .Values.port }}