apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ecommerce-app-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # important : doit matcher le label attendu par le chart pour être détecté
spec:
  groups:
    - name: ecommerce-app
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="demo-app"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            description: "Le pod {{ $labels.pod }} redémarre en boucle dans le namespace demo-app."

        - alert: PodNotReady
          expr: kube_pod_status_ready{namespace="demo-app", condition="true"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            description: "Le pod {{ $labels.pod }} n'est pas Ready depuis plus de 10 minutes."

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="demo-app"}) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="demo-app", resource="memory"}) by (pod)
            > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            description: "Le pod {{ $labels.pod }} utilise plus de 90% de sa limite mémoire."

        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="demo-app"}[5m])) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="demo-app", resource="cpu"}) by (pod)
            > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            description: "Le pod {{ $labels.pod }} utilise plus de 90% de sa limite CPU."