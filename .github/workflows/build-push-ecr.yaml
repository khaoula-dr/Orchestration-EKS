name: Build, Scan & Push images vers ECR

on:
  push:
    branches: [main]
    paths:
      - "ecommerce-app/**"

  pull_request:
    branches: [main]
    paths:
      - "ecommerce-app/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  build-and-scan:
    name: Build & Scan ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - api-gateway
          - user-service
          - product-service
          - order-service
          - notification-service

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build de l'image
        run: |
          docker build \
            -t local/${{ matrix.service }}:scan \
            ./ecommerce-app/${{ matrix.service }}

      - name: Scan de vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Authentification AWS avec OIDC
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login sur Amazon ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push vers ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            local/${{ matrix.service }}:scan \
            $ECR_REGISTRY/orchestration-eks/${{ matrix.service }}:$IMAGE_TAG

          docker tag \
            local/${{ matrix.service }}:scan \
            $ECR_REGISTRY/orchestration-eks/${{ matrix.service }}:latest

          docker push \
            $ECR_REGISTRY/orchestration-eks/${{ matrix.service }}:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/orchestration-eks/${{ matrix.service }}:latest